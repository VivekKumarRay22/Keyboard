<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="keyboard">
        <div class="fisrt-row">
            <button>Q</button>
            <button>W</button>
            <button>E</button>
            <button>R</button>
            <button>T</button>
            <button>Y</button>
            <button>U</button>
            <button>I</button>
            <button>O</button>
            <button>P</button>
        </div>
        <div class="middle-row">
            <button class="a">A</button>
            <button>S</button>
            <button class="d">D</button>
            <button>F</button>
            <button>G</button>
            <button class="h">H</button>
            <button>J</button>
            <button>K</button>
            <button>L</button>
        </div>
        <div class="lower-row">
            <button>Z</button>
            <button>X</button>
            <button class="c">C</button>
            <button>V</button>
            <button class="b">B</button>
            <button>N</button>
            <button>M</button>
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
